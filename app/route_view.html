<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --accent: #eb6834; --accent-tint: #fdeee7; --accent-ink: #b8471c;
    --ink: #1f2430; --muted: #6b7280; --border: #e5e7eb;
    --surface: #ffffff; --bg: #f6f7f9; --rec: #9aa4b2;
    --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { display: grid; grid-template-columns: 380px 1fr; gap: 16px; height: 100%; }
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .panel-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .list { overflow-y: auto; padding: 12px 14px 16px; flex: 1; }
  .stop { display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; }
  .rail { display: flex; flex-direction: column; align-items: center; }
  .badge { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none;
    box-shadow: 0 0 0 3px var(--surface); }
  .badge.start { background: var(--ink); font-size: 14px; }
  .line { flex: 1; width: 0; border-left: 2px dashed #d5d9e0; margin: 4px 0; min-height: 26px; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 6px;
    cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; background: var(--surface); }
  .card:hover { border-color: #f3b49b; transform: translateY(-1px); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .card.start-card { cursor: default; background: var(--bg); }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  /* card: name and arrival time on one line (what and when), then status, then facts */
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-top .time { flex: none; font-size: 13px; font-weight: 600; }
  .facts { gap: 4px; }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts .dot { color: #c4c9d2; }
  .meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .star { color: #f5a524; }
  .chip { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; padding: 2px 7px;
    border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .why { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .leg { font-size: 12px; color: var(--muted); padding: 2px 0 8px; display: flex; align-items: center; gap: 6px; }
  .leg b { color: var(--ink); font-weight: 600; }
  .mapbox { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
  #map { position: absolute; inset: 0; }
  .legend { position: absolute; left: 12px; top: 12px; z-index: 1000; background: rgba(255,255,255,.95); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: var(--shadow); display: grid; gap: 6px; }
  .legend label, .legend .legend-row { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); }
  .sw { width: 22px; height: 0; border-top: 4px solid var(--accent); border-radius: 2px; }
  .sw.rec { border-top: 2px dashed var(--rec); }
  .leaflet-div-icon { background: none; border: none; }
  .marker { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 13px Inter, sans-serif;
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: pointer; transition: transform .12s; }
  .marker:hover, .marker.active { transform: scale(1.18); z-index: 5; }
  .marker.start { background: var(--ink); width: 34px; height: 34px; font-size: 15px; }
  .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: var(--shadow); }
  .leaflet-popup-content { margin: 10px 12px; font: 13px Inter, sans-serif; }
  .leaflet-container { font-family: Inter, sans-serif; background: #eef0f3; }
  /* mute the colourful OSM style so the orange route stands out */
  .leaflet-tile-pane { filter: grayscale(.75) brightness(1.06) contrast(.92); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .dayhead { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; font-size: 13px; font-weight: 700; }
  .dayhead .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dayhead span.sub { font-weight: 500; color: var(--muted); }
  .time { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--ink); font-weight: 500; }
  .st-open { background: #e3f6ee; color: #12795a; }
  .st-closed { background: #fde8e8; color: #b42318; }
  .st-unknown { background: var(--bg); color: var(--muted); }
  /* narrow screens: map on top, itinerary below (the 380 px list would push the map off screen) */
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: 280px minmax(0, 1fr); gap: 12px; }
    .mapbox { order: -1; min-height: 280px; }
    .panel-head { padding: 12px 14px 10px; }
    .list { padding: 10px 10px 14px; }
    .stop { grid-template-columns: 26px 1fr; column-gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <div class="panel-head">
      <h2 id="title"></h2>
      <p id="subtitle"></p>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section class="mapbox">
    <div id="map"></div>
    <div class="legend">
      <div id="legend-days"></div>
      <label><span class="sw rec"></span><input type="checkbox" id="t-rec"> 추천 순서대로</label>
    </div>
  </section>
</div>
<script>
const DATA = /*__DATA__*/null;
const fmtKm = km => km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
const list = document.getElementById("list");

const nStops = DATA.days.reduce((a, d) => a + d.stops.length, 0);
const emptyNote = nStops ? "" :
  '<div class="empty">조건에 맞는 장소가 없어요.<br>카테고리, 출발지, 시간을 바꿔 보세요.</div>';
const statusText = { open: "도착 시 영업 중", closed: "도착 시 닫힘", unknown: "영업시간 정보 없음" };

// itinerary: per day a header, the start, then (leg, stop) pairs
let html = "";
let flat = [];
DATA.days.forEach((day, d) => {
  if (DATA.days.length > 1 || day.label) {
    html += `<div class="dayhead"><span class="dot" style="background:${day.color}"></span>${esc(day.label)}
      <span class="sub">· ${day.stops.length}곳 · ${day.km.toFixed(1)}km · ${day.end} 끝</span></div>`;
  }
  html += `<div class="stop"><div class="rail"><div class="badge start">⌂</div>${day.stops.length ? '<div class="line"></div>' : ''}</div>
    <div><div class="card start-card"><div class="name">${esc(DATA.start.name)}</div>
    <div class="meta">출발</div></div></div></div>`;
  day.stops.forEach((s, k) => {
    const g = flat.length;
    flat.push({ ...s, day: d, k });
    const last = k === day.stops.length - 1;
    html += `<div class="stop"><div class="rail"></div><div class="leg">🚶 <b>${fmtKm(s.leg_km)}</b> · ${s.leg_min}분 ${DATA.walking ? "도보" : "(직선)"}</div></div>
    <div class="stop"><div class="rail"><div class="badge" style="background:${day.color}">${k + 1}</div>${last ? "" : '<div class="line"></div>'}</div>
    <div><div class="card" data-k="${g}">
      <div class="card-top"><div class="name">${esc(s.name)}</div><span class="time" title="도착 예정 시각">${s.arrive}</span></div>
      <div class="meta"><span class="chip st-${s.status}">${statusText[s.status]}</span>${s.hours ? `<span>영업 ${esc(s.hours)}</span>` : ""}</div>
      <div class="meta facts"><span><span class="star" aria-hidden="true">★</span> ${s.stars.toFixed(1)}</span><span class="dot">·</span>
        <span>리뷰 ${s.reviews.toLocaleString()}</span><span class="dot">·</span><span>예상 <b>★${s.pred.toFixed(2)}</b></span>
        <span class="dot">·</span><span>추천 ${s.rank}위</span></div>
      <div class="meta">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="why">${esc(s.why)}</div>
    </div></div></div>`;
  });
});
list.innerHTML = html + emptyNote;

// L.map + OpenStreetMap raster tiles (no API key; CARTO now requires one), polylines and divIcon markers
const map = L.map("map", { zoomControl: false, zoomSnap: 0.25 });
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
const fitRoute = () => map.fitBounds([[DATA.bounds[0][1], DATA.bounds[0][0]], [DATA.bounds[1][1], DATA.bounds[1][0]]],
  { paddingTopLeft: [50, 90], paddingBottomRight: [50, 50] });
fitRoute();
// the frame changes width when the sidebar opens or closes, or on phone rotation:
// tell Leaflet its new size and fit the whole route again
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { map.invalidateSize(); fitRoute(); }, 150);
});

const recLines = DATA.days.map(day => L.polyline(day.rec_path, { color: "#9aa4b2", weight: 2.5, dashArray: "6 6" }));
DATA.days.forEach(day => {
  L.polyline(day.path, { color: "#ffffff", weight: 9, opacity: 1, lineJoin: "round", lineCap: "round" }).addTo(map);
  L.polyline(day.path, { color: day.color, weight: 5, opacity: 0.95, lineJoin: "round", lineCap: "round" }).addTo(map);
});
document.getElementById("legend-days").innerHTML = DATA.days.map(day =>
  `<label><span class="sw" style="border-top-color:${day.color}"></span>${esc(DATA.days.length > 1 ? day.label : "최적 경로")}</label>`).join("");
document.getElementById("t-rec").addEventListener("change", e => {
  recLines.forEach(l => { if (e.target.checked) l.addTo(map).bringToBack(); else l.remove(); });
});

const icon = (text, cls, size, color, dx = 0) => L.divIcon({ className: "", iconSize: [size, size],
  iconAnchor: [size / 2 - dx, size / 2], popupAnchor: [dx, -size / 2],
  html: `<div class="marker ${cls}"${color ? ` style="background:${color}"` : ""}>${text}</div>` });
// places in the same building (e.g. stalls inside Reading Terminal Market) would hide
// each other's pins: shift each later pin sideways by its number of near-duplicates
const near = (a, b) => Math.hypot(a.lat - b.lat, (a.lon - b.lon) * 0.77) < 0.0003;  // about 30 m
const shift = flat.map((s, g) => flat.slice(0, g).filter(t => near(s, t)).length * 22);
L.marker([DATA.start.lat, DATA.start.lon], { icon: icon("⌂", "start", 34), zIndexOffset: 500 })
  .bindPopup(`<b>${esc(DATA.start.name)}</b><br><span style="color:#6b7280">출발</span>`).addTo(map);

const markers = flat.map((s, g) => {
  const m = L.marker([s.lat, s.lon], { icon: icon(s.k + 1, "", 30, DATA.days[s.day].color, shift[g]), riseOnHover: true })
    .bindPopup(`<b>${s.k + 1}. ${esc(s.name)}</b><br><span style="color:#6b7280">도착 ${s.arrive} · ★ ${s.stars.toFixed(1)} · 예상 ★${s.pred.toFixed(2)}</span>`)
    .addTo(map);
  m.on("click", () => select(g, false));
  return m;
});

function select(k, fly = true) {
  document.querySelectorAll(".card[data-k]").forEach(c => c.classList.toggle("active", +c.dataset.k === k));
  markers.forEach((m, j) => { const el = m.getElement() && m.getElement().firstChild; if (el) el.classList.toggle("active", j === k); });
  const s = flat[k];
  if (fly) {
    map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 16), { duration: 0.8 });
    markers[k].openPopup();
  }
  const card = document.querySelector(`.card[data-k="${k}"]`);
  if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
document.querySelectorAll(".card[data-k]").forEach(c => c.addEventListener("click", () => select(+c.dataset.k)));
</script>
</body>
</html>
