name: 버그
description: 잘못된 결과, 에러, 실행 문제
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 문제인가요?
      description: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 실행한 명령과 에러 메시지
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: OS, Python 버전
