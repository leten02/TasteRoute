name: Close linked issues

# GitHub closes "Closes #n" issues only when a PR merges into the default
# branch (main). Feature PRs merge into develop, so close them here.
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set([...(pr.body || '').matchAll(re)].map(m => Number(m[1])));
            for (const n of numbers) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: n, body: `#${pr.number} 이 develop에 머지되어 닫습니다.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed', state_reason: 'completed' });
            }
